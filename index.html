function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function poolTable(pool, empty) {
  if (!pool || !pool.length) return '<div class="pool-empty">' + (empty || '暂无') + '</div>';
  return '<table class="pool-table"><thead><tr><th>股票名称</th><th>行业</th><th>量化评分</th></tr></thead><tbody>' +
    pool.map(p => '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.industry) + '</td><td class="score">' + esc(p.score) + '</td></tr>').join('') +
    '</tbody></table>';
}
function sectorList(sectors) {
  if (!sectors || !sectors.length) return '<div class="pool-empty">无</div>';
  return sectors.map(s => '<div class="sector-block"><div class="sector-name">' + esc(s.name) + '</div><div class="sector-stocks">' +
    esc((s.stocks || []).join('、') || '—') + '</div></div>').join('');
}
function kvBlock(title, items) {
  return '<div class="card"><h3>' + title + '</h3><ul class="kv-list">' +
    items.map(([k, v]) => '<li><b>' + esc(k) + '：</b>' + esc(v) + '</li>').join('') + '</ul></div>';
}
function renderReport(r) {
  const m = r.mood || {};

function paint(data) {
  const reports = data.reports || [];
  document.getElementById('tabs').innerHTML = reports.map((r, i) =>
    '<button class="tab' + (i === 0 ? ' active' : '') + '" onclick="showReport(\'' + esc(r.date) + '\')">' + esc(r.date) + '</button>').join('');
  document.getElementById('reports').innerHTML = reports.map(renderReport).join('');
  if (reports.length) showReport(reports[0].date);
}
function showReport(date) {
  document.querySelectorAll('.report').forEach(s => { s.style.display = s.getAttribute('data-date') === date ? 'block' : 'none'; });
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent.trim() === date));
}
async function syncFromSource() {
  const url = 'https://951367983.github.io/wangjie-q/data.json';
  try {
    const resp = await fetch(url + '?v=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const remote = await resp.json();
    if (remote && remote.reports && remote.reports.length) {
      localStorage.setItem('quant_report_data', JSON.stringify(remote));
      paint(remote);
      document.querySelector('.meta-line').textContent = '数据更新：' + (remote.meta ? remote.meta.updated : '') + ' ｜ 共 ' + remote.reports.length + ' 期 ｜ 已同步';
      alert('更新完成：已同步 ' + remote.reports.length + ' 期报告。');
    } else throw new Error('数据为空');
  } catch (e) { alert('更新失败：' + e.message + '\n请检查网络或稍后再试。'); }
}
(function() {
  const cached = localStorage.getItem('quant_report_data');
  if (cached) {
    try {
      const d = JSON.parse(cached);
      if (d && d.reports && d.reports.length) { paint(d); return; }
    } catch (e) {}
  }
  paint(window.__DATA__);
})();
</script>
